<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CookingUAH - Inicio</title>
  <link rel="stylesheet" href="Home.css" />
</head>
<body>
  <div class="home-container">
    
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <div class="logo">
        <img src="imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
        <h1>CookingUAH</h1>
      </div>

      <nav class="nav-buttons">
        <a href="buscador.html" class="btn-secondary">Buscador</a>
        <a href="mensajes.html" class="btn-secondary">Mensajes</a>
        <a href="perfil.html" class="btn-secondary">Mi Perfil</a>
      </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="feed">
      <h2>Recetas de tus amigos</h2>

      <!-- Publicación 1 -->
      <div class="post">
        <div class="post-header">
          <img src="imagenes/user1.jpg" alt="Usuario" class="user-img" />
          <div>
            <h3>@ChefJuan</h3>
            <span>Hace 2 horas</span>
          </div>
        </div>

        <div class="post-content">
          <p>Hoy preparé una lasaña casera con salsa bechamel 🤤. ¡Aquí mi receta!</p>
          <img src="imagenes/receta1.jpg" alt="Receta de lasaña" class="post-img" />
        </div>

        <div class="post-actions">
          <button class="like-btn">❤️ Me gusta</button>
          <button class="comment-btn">💬 Comentar</button>
        </div>

        <div class="comments">
          <p><strong>@CocineraAna:</strong> ¡Se ve deliciosa!</p>
        </div>
      </div>

      <!-- Publicación 2 -->
      <div class="post">
        <div class="post-header">
          <img src="imagenes/user2.jpg" alt="Usuario" class="user-img" />
          <div>
            <h3>@SaborNatural</h3>
            <span>Hace 5 horas</span>
          </div>
        </div>

        <div class="post-content">
          <p>Pan casero con masa madre 😍 recién salido del horno.</p>
          <img src="imagenes/receta2.jpg" alt="Pan casero" class="post-img" />
        </div>

        <div class="post-actions">
          <button class="like-btn">❤️ Me gusta</button>
          <button class="comment-btn">💬 Comentar</button>
        </div>
      </div>
    </main>

  </div>

  <footer class="footer">
    <p>&copy; 2025 CookingUAH</p>
  </footer>

  <script>
    // Pequeña lógica para simular "me gusta"
    document.querySelectorAll(".like-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        btn.classList.toggle("liked");
        btn.textContent = btn.classList.contains("liked") ? "💖 Te gusta" : "❤️ Me gusta";
      });
    });
  </script>
</body>
</html>
