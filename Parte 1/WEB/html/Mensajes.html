<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes - CookingUAH</title>
  <link rel="stylesheet" href="../css/Home.css"> 
</head>
<body>
  <div class="home-container">

    <aside class="sidebar">
      <div> 
        <div class="logo">
          <img src="../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>
        <nav class="nav-buttons">
          <a href="Home.html" class="btn-secondary">Inicio</a> 
          <a href="Mensajes.html" class="btn-secondary active">Mensajes</a> 
          <a href="Eventos.html" class="btn-secondary">Eventos</a>
          <a href="Notificaciones.html" class="btn-secondary">Notificaciones</a>
          <a href="MiPerfil.html" class="btn-secondary">Mi Perfil</a>
          <a href="Podio.html" class="btn-secondary">Recetas TOP</a>
          <button id="openModalBtn" class="btn-primary">Crear publicación</button>
        </nav>
      </div>
      
      <div class="sidebar-footer">
        <a href="../index.html" class="btn-logout">Cerrar sesión</a>
      </div>
    </aside>

    <main class="feed-chat-page">
      
      <div class="chat-list-container">
        <div class="chat-list-header">
          <h2>Mensajes</h2>
          <button id="refreshDemoBtn" title="Recargar Datos Demo" class="btn-refresh">🔄</button>
        </div>

        <div class="search-bar-container">
          <input type="text" id="userSearch" placeholder="Buscar o empezar un chat nuevo...">
          <button id="userSearchBtn">Buscar</button>
        </div>
        
        <ul class="chat-list">
          <li>
            <div class="chat-list-item" 
                    data-user-id="u4" 
                    data-user-name="Juan" 
                    data-avatar="../Imagenes/Avatar4.jpeg"
                    role="button" tabindex="0">
              <img src="../Imagenes/Avatar4.jpeg" alt="Usuario" class="chat-avatar">
              <div class="chat-info">
                <h3>@Juan</h3>
                <p class="chat-last-message">Cargando...</p>
              </div>
            </div>
          </li>
          <li>
            <div class="chat-list-item" 
                    data-user-id="u5" 
                    data-user-name="Ana" 
                    data-avatar="../Imagenes/Avatar1.jpg"
                    role="button" tabindex="0">
              <img src="../Imagenes/Avatar1.jpg" alt="Usuario" class="chat-avatar">
              <div class="chat-info">
                <h3>@Ana</h3>
                <p class="chat-last-message">Cargando...</p>
              </div>
            </div>
          </li>
          <li>
            <div class="chat-list-item" 
                    data-user-id="u7" 
                    data-user-name="Mario" 
                    data-avatar="../Imagenes/Avatar3.jpg"
                    role="button" tabindex="0">
              <img src="../Imagenes/Avatar3.jpg" alt="Usuario" class="chat-avatar">
              <div class="chat-info">
                <h3>@Mario</h3>
                <p class="chat-last-message">Cargando...</p>
              </div>
            </div>
          </li>
        </ul>
      </div>

      <div class="chat-conversation-container">
        
        <div class="chat-placeholder" id="chatPlaceholder">
          <img src="../Imagenes/logo.png" alt="Logo" class="logo-placeholder" />
          <h3>Tus mensajes</h3>
          <p>Selecciona un chat de la izquierda para ver la conversación.</p>
        </div>

        <div class="chat-active-window" id="chatActiveWindow" style="display: none;">
          <div class="chat-header">
            <h2 id="chatUserName">Selecciona un chat</h2>
          </div>
          <div class="chat-box" id="chatBox">
          </div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Escribe tu mensaje...">
            <button id="sendChatBtn">Enviar</button>
          </div>
        </div>

      </div>
    </main>

  </div>
  
  <div id="postModal" class="modal-backdrop" style="display: none;">
  </div>
  
  <script type="module" src="../js/Home.js"></script> 
  <script type="module" src="../js/Mensajes.js"></script> 
</body>
</html>
