<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Chat con @ChefMario - CookingUAH</title>
  <link rel="stylesheet" href="../../css/Chat.css">
</head>
<body>
  <div class="home-container">

    <aside class="sidebar">
      <div> 
        <div class="logo">
          <img src="../../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>
        <nav class="nav-buttons">
          <a href="../Home.html" class="btn-secondary">Inicio</a> 
          <a href="../Mensajes.html" class="btn-secondary">Mensajes</a>

    <main class="feed chat-page">
      <div class="chat-header">
        <a href="../Mensajes.html" class="btn-volver">&larr; Volver</a>

      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Escribe tu mensaje...">
        <button id="sendChatBtn">Enviar</button>
