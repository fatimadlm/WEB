<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajuste para móviles -->
  <title>Cooking UAH - Registro</title>
  <link rel="stylesheet" href="../css/Registro.css"> <!-- Estilos de la página -->
  <script defer src="../js/Registro.js"></script> <!-- Lógica del registro -->
</head>
<body>
  <div class="login-container">

    <!-- Encabezado / Logo -->
    <header class="logo">
      <img src="../Imagenes/logo.png" alt="Logo Cooking UAH" class="logo-img"> <!-- Logo -->
      <h1>Cooking UAH</h1>
    </header>

    <!-- Caja de registro -->
    <main class="login-box">
      <h2>Crear cuenta</h2>

      <!-- Formulario de registro -->
      <form id="registerForm">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required> <!-- Nombre -->

        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" placeholder="Ej: usuario1" required> <!-- Usuario -->

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="usuario1@correo.com" required> <!-- Email -->

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required> <!-- Contraseña -->

        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required> <!-- Confirmación -->

        <button type="submit" class="btn-primary">Registrarse</button> <!-- Botón enviar -->

        <p class="register-text">
          ¿Ya tienes cuenta?
          <a href="IniciarSesion.html">Inicia sesión</a> <!-- Enlace a iniciar sesión -->
        </p>
      </form>

      <!-- Botón para volver al inicio -->
      <button onclick="window.location.href='../index.html'" class="btn-secondary" style="margin-top: 10px;">
        Volver al inicio
      </button>
    </main>
  </div>
</body>
</html>
