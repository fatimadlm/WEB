<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Publicación - CookingUAH</title>
  <link rel="stylesheet" href="../css/NuevaPublicacion.css" />
</head>
<body>
  <div class="container">

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <div class="logo">
        <img src="../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
        <h1>CookingUAH</h1>
      </div>

      <nav class="nav-buttons">
        <a href="Home.html" class="btn-secondary">Inicio</a>
      </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <h2>Crear una nueva publicación</h2>

      <form class="post-form">
        <label for="titulo">Título de la receta:</label>
        <input type="text" id="titulo" placeholder="Ejemplo: Lasaña casera de pollo" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" rows="5" placeholder="Escribe tu receta, ingredientes o historia detrás del plato..." required></textarea>

        <label for="imagen">Subir imagen:</label>
        <input type="file" id="imagen" accept="image/*">

        <button type="submit" class="btn-publicar">Publicar</button>
      </form>
    </main>

  </div>

  <footer class="footer">
    <p>&copy; 2025 CookingUAH</p>
  </footer>

  <script>
    // Simulación del envío de la publicación
    document.querySelector(".post-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const titulo = document.getElementById("titulo").value;
      alert(`Tu receta "${titulo}" ha sido publicada 🍲`);
      window.location.href = "Home.html";
    });
  </script>
</body>
</html>
