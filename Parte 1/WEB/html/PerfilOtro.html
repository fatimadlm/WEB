<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil de Usuario - CookingUAH</title>
  <link rel="stylesheet" href="../css/Perfil.css" />
</head>

<body>
  <div class="home-container">
    <aside class="sidebar">
      <div> 
        <div class="logo">
          <img src="../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>
        <nav class="nav-buttons">
          <a href="Home.html" class="btn-secondary">Inicio</a> 
          <a href="Mensajes.html" class="btn-secondary active">Mensajes</a> 
          <a href="Eventos.html" class="btn-secondary">Eventos</a>
          <a href="Notificaciones.html" class="btn-secondary">Notificaciones</a>
          <a href="MiPerfil.html" class="btn-secondary">Mi Perfil</a>
          <a href="Podio.html" class="btn-secondary">Recetas TOP</a>
          <button id="openModalBtn" class="btn-primary">Crear publicación</button>
        </nav>
      </div>
      <a href="../index.html" id="btnLogout" class="btn-logout">Cerrar sesión</a>
    </aside>

    <main class="feed perfil-page">
      <section class="perfil-info">
        <img
          id="profileAvatar"
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          alt="Foto de perfil"
          class="perfil-img"
        />
        <div class="perfil-datos">
          <h2 id="profileName">Cargando...</h2>
          <p class="usuario" id="profileUsername">@...</p>
          <p class="bio" id="profileBio">...</p>
          
          <div class="perfil-stats">
              <a href="#" id="showFollowers" class="stat-link">
                <strong><span id="followersCount">0</span></strong> Seguidores
              </a>
              <a href="#" id="showFollowing" class="stat-link">
                <strong><span id="followingCount">0</span></strong> Siguiendo
              </a>
          </div>
          <button id="profileFollowBtn" class="follow-btn">Seguir</button>
        </div>
      </section>

      <section class="perfil-posts" id="profilePostsContainer">
        <h3>Publicaciones</h3>
      </section>
    </main>
  </div>

  <div id="userListModal" class="user-list-modal" style="display: none;">
    <div class="modal-backdrop" id="userListBackdrop"></div>
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="userListTitle">Usuarios</h2>
        <button id="userListClose" class="modal-close-btn">✕</button>
      </header>
      <div class="modal-body">
        <ul id="userList" class="user-list"></ul>
      </div>
    </div>
  </div>

  <script type="module" src="../js/PerfilOtro.js"></script>
</body>
</html>
