<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil de Mario - CookingUAH</title>

  <link rel="stylesheet" href="../../css/Perfil.css" />
</head>

<body>
  <div class="home-container">

    <aside class="sidebar">
      <div> 
        <div class="logo">
          <img src="../../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>
        <nav class="nav-buttons">
          <a href="../Home.html" class="btn-secondary">Inicio</a> 
          <a href="../Mensajes.html" class="btn-secondary">Mensajes</a>
          <a href="../Eventos.html" class="btn-secondary">Eventos</a>
          <a href="../MiPerfil.html" class="btn-secondary">Mi Perfil</a>
          <a href="../Podio.html" class="btn-secondary">Recetas TOP</a>
          <button id="openModalBtn" class="btn-primary">Crear publicación</button>
        </nav>
      </div>
      <a href="../../index.html" class="btn-logout">Cerrar sesión</a>
    </aside>

    <main class="feed perfil-page">

      <!-- Información de Mario -->
      <section class="perfil-info">
        <img src="../../Imagenes/Avatar3.jpg" alt="Foto de perfil" class="perfil-img" />
        <div class="perfil-datos">
          <h2>Mario del Monte</h2>
          <p class="usuario">@Laura</p>
          <p class="comida-fav"><strong>Comida favorita:</strong> Chocolate</p>
          <p class="bio">Me encanta la reposteria</p>
        </div>
      </section>

      <!-- Publicaciones de Mario -->
      <section class="perfil-posts">
        <h3>Publicaciones</h3>

        <div class="post">
          <div class="post-header">
            <img src="../../Imagenes/Avatar3.jpg" alt="Usuario" class="user-img" />
            <div>
              <h4>@Mario</h4>
              <span>Hace 1 horas</span>
            </div>
          </div>
          <div class="post-content">
            <p>Tacos al pastor 🌮, ¡los mejores de la ciudad!</p>
            <img src="../../Imagenes/Tacos.jpg" alt="Tacos" class="post-img" />
          </div>
          <div class="post-actions">
            <button class="like-btn" data-likes-start="15">
              <span class="like-text">❤️ Me gusta</span> (<span class="like-count">15</span>)
            </button>
            <button class="comment-btn">💬 Comentar</button>
          </div>
          <div class="comments"></div>
        </div>
      </section>

    </main>
  </div>

  <script src="../../js/Home.js" defer></script>
  <script src="../../js/PerfilOtro.js" defer></script>

</body>
</html>
