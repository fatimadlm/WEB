<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil de Laura - CookingUAH</title>

  <link rel="stylesheet" href="../../css/Perfil.css" />
</head>

<body>
  <div class="home-container">

    <aside class="sidebar">
      <div> 
        <div class="logo">
          <img src="../../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>
        <nav class="nav-buttons">
          <a href="../Home.html" class="btn-secondary">Inicio</a> 
          <a href="../Mensajes.html" class="btn-secondary">Mensajes</a>
          <a href="../Eventos.html" class="btn-secondary">Eventos</a>
          <a href="../MiPerfil.html" class="btn-secondary">Mi Perfil</a>
          <a href="../Podio.html" class="btn-secondary">Recetas TOP</a>
          <button id="openModalBtn" class="btn-primary">Crear publicación</button>
        </nav>
      </div>
      <a href="../../index.html" class="btn-logout">Cerrar sesión</a>
    </aside>

    <main class="feed perfil-page">

      <section class="perfil-info">
        <img src="../../Imagenes/Avatar5.jpeg" alt="Foto de perfil" class="perfil-img" />
        <div class="perfil-datos">
          <h2>Laura Vaquero</h2>
          <p class="usuario">@Laura</p>
          <p class="bio">Me encanta la reposteria</p>
          
          <div class="perfil-stats">
              <a href="#" id="showFollowers" class="stat-link">
                <strong><span id="followersCount">28</span></strong> Seguidores
              </a>
              <a href="#" id="showFollowing" class="stat-link">
                <strong>60</strong> Siguiendo
              </a>
          </div>
          <button id="profileFollowBtn" class="follow-btn">Seguir</button>
        </div>
      </section>

      <section class="perfil-posts">
        <h3>Publicaciones</h3>

        <div class="post">
          <div class="post-header">
            <img src="../../Imagenes/Avatar5.jpeg" alt="Usuario" class="user-img" />
            <div>
              <h4>@Laura</h4>
              <span>Hace 3 horas</span>
            </div>
          </div>
          <div class="post-content">
            <p>Brownies de chocolate 🍫 con nueces, recién horneados.</p>
            <img src="../../Imagenes/Brownie.jpg" alt="Brownie" class="post-img" />
          </div>
          <div class="post-actions">
            <button class="like-btn" data-likes-start="28">
              <span class="like-text">❤️ Me gusta</span> (<span class="like-count">28</span>)
            </button>
            <button class="comment-btn">💬 Comentar</button>
          </div>
          <div class="comments"></div>
        </div>
      </section>

    </main>
  </div>

  <div id="postModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>Crear una nueva publicación</h2>
      <div id="modalPostBox" class="modal-post-box">
        <textarea id="modalNewPostContent" placeholder="¿Qué estás cocinando, @TuUsuario?"></textarea>
        <div id="modalImagePreviewContainer" class="image-preview-container" style="display: none;">
            <img id="modalImagePreview" src="#" alt="Previsualización de imagen" class="image-preview" style="display: none;">
            <button id="modalRemoveImageBtn" class="remove-image-btn" style="display: none;">✖</button>
        </div>
        <div class="post-controls">
          <div class="post-options">
            <input type="file" id="modalImageUpload" accept="image/*" style="display: none;">
            <button class="option-btn" id="modalAddImgBtn" title="Añadir Imagen">📸</button>
          </div>
          <button id="modalNewPostBtn">Publicar Receta</button>
        </div>
      </div>
    </div>
  </div>

  <div id="userListModal" class="user-list-modal" style="display: none;">
    <div class="modal-backdrop" id="userListBackdrop"></div>
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="userListTitle"></h2>
        <button id="userListClose" class="modal-close-btn">✕</button>
      </header>
      <div class="modal-body">
        <ul id="userList" class="user-list"></ul>
      </div>
    </div>
  </div>

  <script src="../../js/Home.js" defer></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Lógica de "Me Gusta"
      document.querySelectorAll(".perfil-posts .like-btn").forEach(btn => {
        let countElement = btn.querySelector('.like-count');
        let isLiked = false;
        let count = parseInt(btn.dataset.likesStart) || 0;
        btn.addEventListener("click", () => {
          isLiked = !isLiked;
          if (isLiked) { count++; btn.classList.add("liked"); }
          else { count--; btn.classList.remove("liked"); }
          countElement.textContent = count;
        });
      });

      // Lógica de "Comentar"
      document.querySelectorAll(".perfil-posts .comment-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const commentText = prompt("Escribe tu comentario:");
          if (commentText && commentText.trim() !== "") {
            const postElement = btn.closest('.post');
            const commentsContainer = postElement.querySelector('.comments');
            const newComment = document.createElement('p');
            newComment.innerHTML = `<strong>@TuUsuario:</strong> ${commentText}`; 
            commentsContainer.appendChild(newComment);
            commentsContainer.scrollTop = commentsContainer.scrollHeight;
          }
        });
      });

      // ====================================================
      // Lógica del Modal de Seguidores/Siguiendo (DATOS DE LAURA)
      // ====================================================
      const followersData = [
        { username: "@Mario", name: "Mario del Monte", avatar: "../../Imagenes/Avatar3.jpg" }
      ];
      const followingData = [
        { username: "@Ana", name: "Ana López", avatar: "../../Imagenes/Avatar1.jpg" }
      ];

      const modal = document.getElementById('userListModal');
      const backdrop = document.getElementById('userListBackdrop');
      const closeBtn = document.getElementById('userListClose');
      const title = document.getElementById('userListTitle');
      const list = document.getElementById('userList');
      const showFollowersBtn = document.getElementById('showFollowers');
      const showFollowingBtn = document.getElementById('showFollowing');

      const openUserListModal = (titleText, users) => {
        title.textContent = titleText;
        list.innerHTML = ''; 

        if (users.length === 0) {
          list.innerHTML = '<li class="empty-list">No hay usuarios que mostrar.</li>';
        }

        users.forEach(user => {
          const li = document.createElement('li');
          li.className = 'user-list-item';

          let isFollowing = false; // Simulación

          const btnText = isFollowing ? 'Siguiendo' : 'Seguir';
          const btnClass = isFollowing ? 'follow-btn following' : 'follow-btn';

          li.innerHTML = `
            <img src="${user.avatar}" alt="${user.username}" class="user-list-avatar">
            <div class="user-list-info">
              <strong>${user.name}</strong>
              <span>${user.username}</span>
            </div>
            <button class="${btnClass}">${btnText}</button>
          `;
          
          const followBtn = li.querySelector('.follow-btn');
          followBtn.addEventListener('click', () => {
              isFollowing = !isFollowing;
              if (isFollowing) {
                  followBtn.textContent = 'Siguiendo';
                  followBtn.classList.add('following');
              } else {
                  followBtn.textContent = 'Seguir';
                  followBtn.classList.remove('following');
              }
          });
          list.appendChild(li);
        });
        modal.style.display = 'flex';
      };

      const closeUserListModal = () => {
        modal.style.display = 'none';
      };

      showFollowersBtn.addEventListener('click', (e) => {
        e.preventDefault();
        openUserListModal('Seguidores', followersData);
      });

      showFollowingBtn.addEventListener('click', (e) => {
        e.preventDefault();
        openUserListModal('Siguiendo', followingData);
      });

      closeBtn.addEventListener('click', closeUserListModal);
      backdrop.addEventListener('click', closeUserListModal);

      // Lógica del botón principal "Seguir"
      const mainFollowBtn = document.getElementById('profileFollowBtn');
      const followersCountSpan = document.getElementById('followersCount');
      
      let isFollowingProfile = false; // Estado inicial (simulado)
      let followersCount = parseInt(followersCountSpan.textContent);

      mainFollowBtn.addEventListener('click', () => {
          isFollowingProfile = !isFollowingProfile;
          if (isFollowingProfile) {
              followersCount++;
              mainFollowBtn.textContent = 'Siguiendo';
              mainFollowBtn.classList.add('following');
          } else {
              followersCount--;
              mainFollowBtn.textContent = 'Seguir';
              mainFollowBtn.classList.remove('following');
          }
          followersCountSpan.textContent = followersCount;
      });
    });
  </script>

</body>
</html>
