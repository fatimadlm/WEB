<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CookingUAH - Eventos</title>
  <link rel="stylesheet" href="../css/Eventos.css" />
  </head>
<body>
  <div class="home-container">
    
    <aside class="sidebar">
      <div>
        <div class="logo">
          <img src="../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>

        <nav class="nav-buttons">
          <a href="Home.html" class="btn-secondary">Inicio</a> 
          <a href="Mensajes.html" class="btn-secondary">Mensajes</a>
          <a href="Eventos.html" class="btn-secondary active">Eventos</a> <a href="MiPerfil.html" class="btn-secondary">Mi Perfil</a>
          <a href="Podio.html" class="btn-secondary">Recetas TOP</a>
          <button id="openModalBtn" class="btn-primary">Crear publicación</button>
        </nav>
      </div>

      <a href="../index.html" class="btn-logout">Cerrar sesión</a>
    </aside>

    <main class="feed eventos-feed">
      <h2>Calendario de eventos</h2>

      <div class="calendar">
        <div class="calendar-header">
          <button id="prevMonth">←</button>
          <h3 id="monthYear">Noviembre 2025</h3>
          <button id="nextMonth">→</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="event-details" id="eventDetails">
        <h3>Eventos seleccionados</h3>
        <ul id="eventList">
          <li>Selecciona un día del calendario para ver los eventos.</li>
        </ul>
      </div>

      <section class="crear-evento">
        <h3>Crear un nuevo evento</h3>
        <form id="addEventForm" class="form-evento">
          <label for="eventDate">Fecha:</label>
          <input type="date" id="eventDate" required />

          <label for="eventTitle">Título:</label>
          <input type="text" id="eventTitle" placeholder="Ej: Clase de sushi" required />

          <label for="eventTime">Hora:</label>
          <input type="time" id="eventTime" required />

          <button type="submit" class="btn-primary">Añadir evento</button>
        </form>
      </section>
    </main>
  </div>

  <div id="postModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>Crear una nueva publicación</h2>
      <div id="modalPostBox" class="modal-post-box">
        <textarea id="modalNewPostContent" placeholder="¿Qué estás cocinando, @TuUsuario?"></textarea>
        <div id="modalImagePreviewContainer" class="image-preview-container" style="display: none;">
            <img id="modalImagePreview" src="#" alt="Previsualización de imagen" class="image-preview" style="display: none;">
            <button id="modalRemoveImageBtn" class="remove-image-btn" style="display: none;">✖</button>
        </div>
        <div class="post-controls">
          <div class="post-options">
            <input type="file" id="modalImageUpload" accept="image/*" style="display: none;">
            <button class="option-btn" id="modalAddImgBtn" title="Añadir Imagen">📸</button>
          </div>
          <button id="modalNewPostBtn">Publicar Receta</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/Home.js"></script>
  <script src="../js/Eventos.js"></script>
</body>
</html>
