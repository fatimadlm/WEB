<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CookingUAH - Inicio</title>
  <link rel="stylesheet" href="../css/Home.css" />
</head>
<body>
  <!-- Contenedor principal -->
  <div class="home-container">
    
    <!-- Barra lateral -->
    <aside class="sidebar">
      <div> 
        <!-- Logo -->
        <div class="logo">
          <img src="../Imagenes/logo.png" alt="Logo CookingUAH" class="logo-img" />
          <h1>CookingUAH</h1>
        </div>

        <!-- Botones de navegación -->
        <nav class="nav-buttons">
          <a href="Home.html" class="btn-secondary">Inicio</a> 
          <a href="Mensajes.html" class="btn-secondary">Mensajes</a>
          <a href="Eventos.html" class="btn-secondary">Eventos</a>
          <a href="MiPerfil.html" class="btn-secondary">Mi Perfil</a>
          <a href="Podio.html" class="btn-secondary">Recetas TOP</a>
          <button id="openModalBtn" class="btn-primary">Crear publicación</button>
        </nav>
      </div>

      <!-- Botón cerrar sesión -->
      <a href="../index.html" class="btn-logout">Cerrar sesión</a>
    </aside>

    <!-- Contenido principal -->
    <main class="feed">
      <!-- Barra de búsqueda -->
      <div class="top-bar">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Buscar recetas..." />
          <button id="searchBtn">Buscar</button>
        </div>
      </div>

      <!-- Crear publicación -->
      <div class="create-post">
        <textarea id="newPostContent" placeholder="¿Qué estás cocinando, @TuUsuario?"></textarea>
        
        <!-- Previsualización de imagen -->
        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
            <img id="imagePreview" src="#" alt="Previsualización de imagen" class="image-preview" style="display: none;">
            <button id="removeImageBtn" class="remove-image-btn" style="display: none;">✖</button>
        </div>

        <!-- Controles del post -->
        <div class="post-controls">
          <div class="post-options">
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <button class="option-btn" id="addImgBtn" title="Añadir Imagen">📸</button>
          </div>
          <button id="newPostBtn">Publicar Receta</button>
        </div>
      </div>

      <!-- Lista de publicaciones -->
      <h2>Recetas de tus amigos</h2>
      <div id="postsContainer"></div>
    </main>
  </div>

  <!-- Modal para crear publicación -->
  <div id="postModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>Crear una nueva publicación</h2>

      <div id="modalPostBox" class="modal-post-box">
        <textarea id="modalNewPostContent" placeholder="¿Qué estás cocinando, @TuUsuario?"></textarea>
        
        <!-- Imagen en el modal -->
        <div id="modalImagePreviewContainer" class="image-preview-container" style="display: none;">
            <img id="modalImagePreview" src="#" alt="Previsualización de imagen" class="image-preview" style="display: none;">
            <button id="modalRemoveImageBtn" class="remove-image-btn" style="display: none;">✖</button>
        </div>

        <!-- Botones del modal -->
        <div class="post-controls">
          <div class="post-options">
            <input type="file" id="modalImageUpload" accept="image/*" style="display: none;">
            <button class="option-btn" id="modalAddImgBtn" title="Añadir Imagen">📸</button>
          </div>
          <button id="modalNewPostBtn">Publicar Receta</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/Home.js"></script>
</body>
</html>
